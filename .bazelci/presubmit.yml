---
buildifier:
  version: 8.5.1

matrix:
  bazel: ["9.x"]
  platform:
    [
      "windows",
      "ubuntu2004",
      "rbe_ubuntu2204",
      "macos",
      "macos_arm64",
      "ubuntu2004_arm64",
      "windows_arm64",
    ]
  flag_combo:
    [
      ["--@rules_dotnet//dotnet/settings:strict_deps=true"],
      ["--@rules_dotnet//dotnet/settings:strict_deps=false"],
    ]
  e2e_working_directory: ["e2e/net8.0", "e2e/net9.0", "e2e/net10.0", "e2e/web_sdk"]
  # Coverage gets its own platform lists because the post-run assertions differ
  # per shell: grep on POSIX, findstr on Windows.
  coverage_platform: ["ubuntu2004", "macos"]
  coverage_platform_windows: ["windows"]

tasks:
  test_all:
    name: Build and test
    bazel: ${{ bazel }}
    platform: ${{ platform }}
    working_directory: ""
    include_json_profile:
      - build
      - test
    build_targets:
      - "//..."
    test_targets:
      - "//..."
    build_flags: ${{ flag_combo }}
    test_flags: ${{ flag_combo }}
  examples:
    name: Build and test
    bazel: ${{ bazel }}
    platform: ${{ platform }}
    working_directory: "examples"
    include_json_profile:
      - build
      - test
    build_targets:
      - "//..."
    test_targets:
      - "//..."
    build_flags: ${{ flag_combo }}
    test_flags: ${{ flag_combo }}
  e2e:
    name: ${{ e2e_working_directory }}
    bazel: ${{ bazel }}
    platform: ${{ platform }}
    working_directory: ${{ e2e_working_directory }}
    include_json_profile:
      - build
      - test
    build_targets:
      - "//..."
    test_targets:
      - "//..."
  coverage:
    name: Coverage
    bazel: ${{ bazel }}
    platform: ${{ coverage_platform }}
    working_directory: "examples"
    coverage_targets:
      - "//basic_csharp:lib_test"
    coverage_flags:
      - "--@rules_dotnet//dotnet/settings:coverage_tool=@paket.example_deps//coverlet.console/tools:coverlet"
      - "--combined_report=lcov"
    # An empty coverage report exits 0 at every layer -- the coverage tool, the
    # LCOV merger and Bazel itself -- so a green `bazel coverage` proves nothing
    # on its own. Assert the report actually attributes hits to the library
    # source, which is what silently breaks if the SF: paths stop matching
    # Bazel's coverage manifest.
    post_shell_commands:
      - "grep -q '^SF:basic_csharp/lib.cs$' bazel-out/_coverage/_coverage_report.dat"
      - "grep -qE '^DA:[0-9]+,[1-9]' bazel-out/_coverage/_coverage_report.dat"
  coverage_windows:
    name: Coverage
    bazel: ${{ bazel }}
    platform: ${{ coverage_platform_windows }}
    working_directory: "examples"
    coverage_targets:
      - "//basic_csharp:lib_test"
    coverage_flags:
      - "--@rules_dotnet//dotnet/settings:coverage_tool=@paket.example_deps//coverlet.console/tools:coverlet"
      - "--combined_report=lcov"
    # Same assertions as above, in findstr. Two differences from the grep form:
    # /c: is a literal search string, so the anchors become /b and /e rather than
    # ^ and $; and findstr has no "+" quantifier, so digit runs are spelled out.
    # Both guard the same thing -- that source paths still match the coverage
    # manifest, which on Windows additionally depends on rewriting the ".\"
    # prefix and the backslashes that PDB documents carry.
    post_shell_commands:
      - "findstr /b /e /c:\"SF:basic_csharp/lib.cs\" bazel-out\\_coverage\\_coverage_report.dat"
      - "findstr /r \"^DA:[0-9][0-9]*,[1-9]\" bazel-out\\_coverage\\_coverage_report.dat"
